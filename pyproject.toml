[project]
name = "asl-translate"
version = "0.1.0"
description = "Live ASL video translation (CS6170 Capstone)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "mediapipe",
    "pyyaml>=6.0.3",
    "pandas>=3.1.0",
    "matplotlib>=3.11.2",
    "huggingface-hub>=2.4.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asl_translate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
